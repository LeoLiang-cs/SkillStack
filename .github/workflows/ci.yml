name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install core dependencies
        run: uv sync --frozen

      - name: Run repository preflight
        run: uv run skillstack preflight

      - name: Check public repository files
        run: uv run skillstack check-repo

      - name: Run zero-model composability demo
        run: uv run skillstack demo --output-root "$RUNNER_TEMP/skillstack-demo"

      - name: Compile Python sources
        run: uv run python -m compileall -q src scripts tests

      - name: Run unit tests
        run: uv run python scripts/run_core_gate.py --summary "$RUNNER_TEMP/skillstack-core-gate.json"

      - name: Retain core gate summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skillstack-core-gate-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/skillstack-core-gate.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build package
        run: uv build

      - name: Verify wheel and sdist outside checkout
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv run python scripts/check_package_install.py \
            --python 3.12 \
            --summary "$RUNNER_TEMP/skillstack-package-acceptance.json"

      - name: Retain package acceptance summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skillstack-package-acceptance-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/skillstack-package-acceptance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify isolated public snapshot
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run skillstack release-check
