name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install core dependencies
        run: uv sync --frozen

      - name: Run repository preflight
        run: uv run skillstack preflight

      - name: Check public repository files
        run: uv run skillstack check-repo

      - name: Run zero-model composability demo
        run: uv run skillstack demo --output-root "$RUNNER_TEMP/skillstack-demo"

      - name: Compile Python sources
        run: uv run python -m compileall -q src scripts tests

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -q

      - name: Build package
        run: uv build

      - name: Verify isolated public snapshot
        if: matrix.python-version == '3.10'
        run: uv run skillstack release-check
